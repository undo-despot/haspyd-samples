<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>haspyd ᚼ strudel</title>
<meta name="description" content="Strudel Аліси Хаспид: живий код зі знайденими й власними звуками.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Martian+Mono:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  /* Кольори й шрифт: міняй тут, і зміниться все. */
  html:root {
    --ink: #000000;
    --bone: #d9d2c0;
    --dim: #6f6a5e;
    --brass: #c8a13a;
    --oxide: #c2553a;
    --mono: "Martian Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --size: 16px;

    /* змінні, які читає сам Strudel */
    --foreground: var(--brass) !important;
    --background: var(--ink) !important;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--ink); }
  body {
    color: var(--bone);
    font: 300 13px/1.5 var(--mono);
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto auto;
    overflow: hidden;
  }

  /* верхній рядок */
  header {
    display: flex; align-items: baseline; gap: 2ch;
    padding: 10px 16px 8px;
    border-bottom: 1px solid var(--dim);
  }
  header h1 { font: inherit; font-weight: 600; margin: 0; letter-spacing: .02em; }
  header h1 span { color: var(--brass); }
  header .gap { flex: 1; }
  button {
    font: inherit; color: var(--bone); background: none;
    border: 1px solid var(--dim); padding: 2px 1.2ch; cursor: pointer;
  }
  button:hover { border-color: var(--bone); }
  button:focus-visible, .cm-editor:focus-visible { outline: 2px solid var(--brass); outline-offset: 2px; }
  #play { min-width: 9ch; text-align: left; }
  #play[aria-pressed="true"] { color: var(--ink); background: var(--brass); border-color: var(--brass); font-weight: 600; }

  /* редактор */
  main { min-height: 0; overflow: auto; padding: 12px 4px 12px 0; }
  main > div { font-family: var(--mono) !important; }
  .cm-editor { background: transparent !important; color: var(--bone) !important; }
  .cm-editor .cm-scroller { font-family: var(--mono) !important; font-weight: 300; line-height: 1.65; }
  .cm-editor .cm-gutters { background: transparent !important; color: var(--dim) !important; border: 0 !important; }
  .cm-editor .cm-cursor { border-left: 2px solid var(--brass) !important; }
  .cm-editor.cm-focused { outline: none !important; }
  .cm-editor .cm-selectionBackground,
  .cm-editor .cm-content ::selection { background: #c8a13a44 !important; }

  /* сітка: кожен звук — рядок, кожен удар — клітинка */
  #work { display: grid; grid-template-columns: minmax(0, 1fr) auto; min-height: 0; }
  #work.nogrid #orca { display: none; }
  #orca {
    border-left: 1px solid var(--dim);
    padding: 14px 18px 10px 16px;
    display: grid; grid-template-rows: minmax(0, 1fr) auto;
    font: 300 14px/1 var(--mono); color: var(--dim);
    overflow: hidden; user-select: none;
  }
  #cells { display: grid; grid-template-columns: 17ch repeat(32, 2.1ch); grid-auto-rows: 2.1ch; align-content: start; overflow: hidden; }
  #cells span { display: block; text-align: center; line-height: 2.1ch; height: 2.1ch; }
  #cells .name { text-align: left; color: var(--bone); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 1ch; }
  #cells .ph { color: var(--bone); }
  #cells .old { color: #8a8474; }
  #cells .on { color: var(--brass); }
  #cells .hit { background: var(--brass); color: var(--ink); font-weight: 600; }
  #bar { padding-top: 10px; color: var(--bone); white-space: pre; }
  #bar b { color: var(--brass); font-weight: 400; }
  #gridtoggle[aria-pressed="true"] { border-color: var(--brass); color: var(--brass); }
  @media (max-width: 900px) { #orca, #gridtoggle { display: none; } }

  /* письмо: музика пише рядок знаків */
  #script {
    border-top: 1px solid var(--dim);
    height: 3.2em; line-height: 3.2em;
    font-size: 22px; color: var(--brass);
    display: flex; justify-content: flex-end; overflow: hidden;
    padding: 0 16px;
    -webkit-mask-image: linear-gradient(to right, transparent, #000 35%);
            mask-image: linear-gradient(to right, transparent, #000 35%);
    user-select: none;
  }
  #glyphs { flex: none; white-space: pre; }

  /* нижній рядок */
  footer {
    display: flex; gap: 3ch; flex-wrap: wrap;
    padding: 6px 16px 9px; color: var(--dim);
    border-top: 1px solid var(--dim);
  }
  footer kbd { font: inherit; color: var(--bone); }
  #status { margin-left: auto; color: var(--bone); max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #status.err { color: var(--oxide); }

  @media (max-width: 640px) {
    header { flex-wrap: wrap; row-gap: 6px; }
    footer .keys { display: none; }
    #script { font-size: 18px; }
  }
</style>
</head>
<body>

<header>
  <h1>haspyd <span aria-hidden="true">ᚼ</span> strudel</h1>
  <span class="gap"></span>
  <button id="demo">приклад</button>
  <button id="gridtoggle" aria-pressed="true">сітка</button>
  <button id="smaller" aria-label="Менший шрифт">A−</button>
  <button id="bigger" aria-label="Більший шрифт">A+</button>
  <button id="play" aria-pressed="false">▷ грати</button>
</header>

<div id="work"><main id="stage"></main><aside id="orca" aria-hidden="true"><div id="cells"></div><div id="bar"></div></aside></div>

<div id="script" aria-hidden="true"><span id="glyphs"></span></div>

<footer>
  <span class="keys"><kbd>ctrl</kbd>+<kbd>enter</kbd> грати / оновити</span>
  <span class="keys"><kbd>ctrl</kbd>+<kbd>.</kbd> стоп</span>
  <span id="status">завантажую звуки…</span>
</footer>

<script src="vendor/strudel/index.js"></script>
<script>
(() => {
  const DEFAULT_CODE = `samples('github:undo-despot/haspyd-samples')
setcpm(33)

// ── ритм ────────────────────────────────────────────────
$: s("ae_kick(<3 5 3 7>,16,<0 2 0 5>)")
  .n("<0 0 1 0>").speed("<1 1 .9 1.2>").shape(.3)
  .linger("<1 1 1 .5 1 1 .25 1>")
  .mask("<0!4 1!60>")

$: s("ae_sh09").n(4)
  .struct("~ x ~ ~ x ~ ~ [~ x]")
  .sometimesBy(.25, x => x.speed(-1))
  .crush(7).room(.2).gain(.8)
  .mask("<0!8 1!56>")

$: s("ae_sh09*<8 12 16 6>").n(1)
  .gain(perlin.range(.15, .5)).pan(sine.fast(3)).hpf(3000)

$: s("true_face_drums*8").n(irand(16))
  .degradeBy(.45).ribbon(3, 2)
  .hpf(200).cut(5).gain(.5)
  .mask("<0!12 1!52>")

$: s("sp_arovane").n("<0 2 4 1>")
  .slice(8, "0 ~ 3 [5 5] ~ 6 2 ~")
  .cut(4).gain(.55)
  .mask("<0!16 1!48>")

$: s("sp_glitch(5,16,<0 3>)").n(irand(8))
  .ribbon(11, 1).pan(rand).gain(.5)
  .mask("<0!6 1!58>")

// ── метал ───────────────────────────────────────────────
$: s("ae_steel*16").n(irand(63))
  .degradeBy(.35).ribbon(7, 2)
  .speed("<1 1 1.5 1 .5 1 2 1>")
  .pan(rand).cut(1).gain(.55)
  .off(1/16, x => x.speed(2).gain(.25))

$: n("0 [5 17] 9 ~ 20 ~ [3 3 3] 30").add(n("<0 4 2 7>"))
  .s("ae_steelx").jux(rev)
  .delay(.3).delaytime(3/16).delayfeedback(.5).gain(.6)
  .mask("<0!2 1!62>")

$: s("sp_bell(3,8,<0 2 5>)").n("<0 2 4 5>")
  .speed("<1 .5 2 1.5>")
  .delay(.5).delaytime(3/16).delayfeedback(.6)
  .room(.4).gain(.4)

$: s("anvil*<2 3>").n("<0 1 2>")
  .speed("<1 1.3 .8>").room(.3).gain(.35)
  .mask("<0!10 1!54>")

// ── латунь ──────────────────────────────────────────────
$: s("vs_tuba").n("<0 0 3 1>")
  .struct("x ~ ~ ~ ~ x ~ ~")
  .shape(.3).lpf(700).gain(.9)
  .mask("<0!8 1!56>")

$: s("vs_buzz").n(irand(10))
  .struct("~ ~ x ~ ~ ~ ~ [x x]").ribbon(5, 4)
  .pan(.3).room(.3).gain(.5)
  .mask("<0!14 1!50>")

$: s("<vs_fall ~ ~ vs_fall:4 ~ vs_fall:7 ~ ~>")
  .room(.6).delay(.5).delaytime(3/8).gain(.5)

$: s("vs_mute").n("<[0,3] [1,5] [2,6] [4,7]>")
  .slow(2).attack(.3).release(1)
  .room(.8).roomsize(5).orbit(2).gain(.35)

// ── тон ─────────────────────────────────────────────────
$: s("ae_sh09").n(0)
  .struct("x ~ ~ x ~ ~ x ~")
  .speed("<1 1 .75 1.5>").clip(.6)
  .lpf(sine.range(200, 2200).fast(3)).lpq(12).shape(.4)
  .mask("<0!20 1!44>")

$: s("ae_shstr").n("<3 12 20 7 31 16>")
  .slice(8, "0 3 [1 6] 2 7 ~ 5 4")
  .cut(2).room(.4).gain(.55)
  .mask("<0!12 1!52>")

$: s("ae_mell").n("<[0,5] [3,7] [1,9] [6,11]>")
  .slow(2).speed(.5).attack(.4).release(1.5)
  .lpf(sine.range(400, 3000).slow(16))
  .room(.9).roomsize(6).orbit(2).gain(.45)

$: s("bip_3*4").n("0 3 5 2")
  .degradeBy(.5).ribbon(9, 2)
  .crush(8).pan(.7).gain(.35)

// ── голос і простір ─────────────────────────────────────
$: s("sp_choir").chop(8).rev().slow(4)
  .room(.9).roomsize(8).orbit(2).gain(.4)

$: s("<~ ~ ~ ae_vox ~ ~ ae_vox:1 ~>")
  .chop(16).rev().speed(.5)
  .room(.9).orbit(2).gain(.45)

$: s("eye_tracker_2(3,16,7)").n(irand(8))
  .ribbon(2, 2).speed(2).pan(.2).gain(.35)

$: s("radio_7105_1850/2").n("<0 1 2 3 4 5>/2")
  .hpf(400).pan(sine.slow(8)).gain(.22)

$: s("sp_glass/4").n("<0 1 2>/4")
  .room(.8).orbit(2).gain(.3)
`;

  const store = {
    get(k, d) { try { return localStorage.getItem(k) ?? d; } catch { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch {} },
  };

  const $ = (id) => document.getElementById(id);
  const status = (text, err = false) => { $('status').textContent = text; $('status').classList.toggle('err', err); };

  // ── редактор ─────────────────────────────────────────────
  const el = document.createElement('strudel-editor');
  el.setAttribute('code', store.get('haspyd-code', DEFAULT_CODE));
  $('stage').append(el);

  let size = Number(store.get('haspyd-size', 16)) || 16;
  const ed = el.editor;
  if (!ed) { status('редактор не завантажився — онови сторінку', true); return; }

  const applySettings = () => ed.updateSettings({
    keybindings: 'codemirror',
    theme: 'blackscreen',
    fontFamily: getComputedStyle(document.documentElement).getPropertyValue('--mono'),
    fontSize: size,
    isLineNumbersDisplayed: true,
    isLineWrappingEnabled: true,
    isBracketClosingEnabled: true,
    isBracketMatchingEnabled: false,
    isActiveLineHighlighted: false,
    isPatternHighlightingEnabled: true,
    isFlashEnabled: true,
    isAutoCompletionEnabled: false,
    isTooltipEnabled: false,
    isTabIndentationEnabled: false,
    isMultiCursorEnabled: false,
  });
  applySettings();

  const resize = (d) => { size = Math.max(10, Math.min(40, size + d)); store.set('haspyd-size', size); ed.setFontSize(size); };
  $('smaller').onclick = () => resize(-2);
  $('bigger').onclick = () => resize(2);
  $('play').onclick = () => ed.toggle();

  // «приклад» показує демо-трек; твій код зберігається і повертається другим кліком
  const showDemo = (on) => {
    if (on) { store.set('haspyd-code-mine', ed.code || ''); ed.setCode(DEFAULT_CODE); }
    else { ed.setCode(store.get('haspyd-code-mine', DEFAULT_CODE)); }
    store.set('haspyd-demo', on ? '1' : '0');
    $('demo').textContent = on ? 'назад до мого' : 'приклад';
  };
  if (store.get('haspyd-demo', '0') === '1') $('demo').textContent = 'назад до мого';
  $('demo').onclick = () => showDemo(store.get('haspyd-demo', '0') !== '1');

  // ── стан: грає / стоїть / помилка ────────────────────────
  el.addEventListener('update', (e) => {
    const s = e.detail || {};
    const on = !!s.started;
    $('play').setAttribute('aria-pressed', on);
    $('play').textContent = on ? '■ стоп' : '▷ грати';
    const error = s.evalError || s.schedulerError;
    if (error) status(String(error.message || error), true);
    else if (s.pending) status('думаю…');
    else status(on ? 'грає' : 'тиша');
    if (ed.code) store.set('haspyd-code', ed.code);
  });
  addEventListener('beforeunload', () => { if (ed.code) store.set('haspyd-code', ed.code); });

  // ── письмо: кожен звук ставить свій знак ─────────────────
  // Той самий звук завжди дає той самий знак, тож ритм читається як текст.
  const SIGNS = [...'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊᛏᛒᛖᛗᛚᛜᛞᛟᚼᛅᛦᛣᛤᛥ' +
                    'ⴰⴱⴳⴷⴹⴻⴼⴽⵀⵃⵄⵅⵇⵉⵊⵍⵎⵏⵓⵔⵕⵖⵙⵚⵛⵜⵟⵡⵢⵣⵥ' +
                    'ᐁᐃᐅᐊᐯᐱᐳᐸᑌᑎᑐᑕᑫᑭᑯᑲᒉᒋᒍᒐᒣᒥᒧᒪᓀᓂᓄᓇᓭᓯᓱᓴ' +
                    '⠇⠏⠗⠛⠝⠟⠧⠫⠭⠯⠷⠹⠻⠽⠾⡇⡏⡗⡧⢇⢎⢕⢣⣀⣉⣒⣛⣤⣭⣶⣿'];
  const hash = (str) => { let h = 2166136261; for (const c of str) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; };
  const glyphs = $('glyphs');
  const MAX = 240;
  let line = '', last = null, lastCycle = -1, dirty = false;

  // ── сітка: рядок = звук, стовпчик = крок такту ───────────
  const COLS = 32;
  const cellsEl = $('cells'), bar = $('bar'), work = $('work');
  let ROWS = 0, cells = [], names = [];
  const rowOf = new Map();
  const blank = (r, c) => (r % 4 === 0 && c % 8 === 0) ? '+' : '·';
  const buildGrid = () => {
    const first = cellsEl.firstElementChild;
    const cellH = first ? first.getBoundingClientRect().height : 0;
    const rows = Math.max(8, Math.min(60, Math.floor(cellsEl.clientHeight / (cellH || 17))));
    if (rows === ROWS) return;
    ROWS = rows; cells = []; names = []; cellsEl.textContent = '';
    for (let r = 0; r < ROWS; r++) {
      const name = document.createElement('span'); name.className = 'name'; cellsEl.append(name); names.push(name);
      cells.push([]);
      for (let c = 0; c < COLS; c++) { const x = document.createElement('span'); x.textContent = blank(r, c); cellsEl.append(x); cells[r].push(x); }
    }
    for (const [s, r] of rowOf) if (r < ROWS) names[r].textContent = s;
    phCol = -1;
  };
  let gridCycle = -1, phCol = -1;
  const turn = () => {
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      const x = cells[r][c];
      if (x.classList.contains('old')) { x.className = ''; x.textContent = blank(r, c); }
      else if (x.classList.contains('on') || x.classList.contains('hit')) x.className = 'old';
    }
  };
  const gridHit = (s, glyph, t) => {
    if (!s || work.classList.contains('nogrid')) return;
    let r = rowOf.get(s);
    if (r === undefined) { r = rowOf.size; rowOf.set(s, r); if (r < ROWS) names[r].textContent = s; }
    if (r >= ROWS) return;
    const c = Math.min(COLS - 1, Math.floor((t - Math.floor(t)) * COLS + 1e-6));
    const x = cells[r][c];
    x.textContent = glyph; x.className = 'hit';
    setTimeout(() => { if (x.classList.contains('hit')) x.className = 'on'; }, 130);
  };
  const gridTick = (time) => {
    if (work.classList.contains('nogrid')) return;
    const cyc = Math.floor(time);
    if (cyc !== gridCycle) { if (gridCycle >= 0) turn(); gridCycle = cyc; }
    const c = Math.floor((time - cyc) * COLS);
    if (c !== phCol) {
      if (phCol >= 0) for (let r = 0; r < ROWS; r++) cells[r][phCol].classList.remove('ph');
      for (let r = 0; r < ROWS; r++) cells[r][c].classList.add('ph');
      phCol = c;
      bar.innerHTML = `цикл <b>${String(cyc).padStart(3, '0')}</b>   крок <b>${String(c + 1).padStart(2, '0')}</b>/${COLS}   голосів <b>${rowOf.size}</b>`;
    }
  };
  const setGrid = (on) => {
    work.classList.toggle('nogrid', !on);
    $('gridtoggle').setAttribute('aria-pressed', on);
    store.set('haspyd-grid', on ? '1' : '0');
    if (on) { ROWS = 0; buildGrid(); buildGrid(); }
  };
  $('gridtoggle').onclick = () => setGrid(work.classList.contains('nogrid'));
  setGrid(store.get('haspyd-grid', '1') === '1');
  addEventListener('resize', () => { if (!work.classList.contains('nogrid')) buildGrid(); });

  const base = ed.onDraw.bind(ed);
  ed.onDraw = (haps, time, painters) => {
    base(haps, time, painters);
    if (last === null || time < last) { last = time; return; }
    gridTick(time);
    for (const hap of haps) {
      const t = hap.whole?.begin?.valueOf?.();
      if (t === undefined || t <= last || t > time) continue;
      const v = hap.value || {};
      const key = `${v.s ?? ''}:${v.n ?? v.note ?? ''}`;
      const cycle = Math.floor(t);
      if (cycle !== lastCycle) { line += ' '; lastCycle = cycle; }
      const sign = SIGNS[hash(key) % SIGNS.length];
      line += sign;
      gridHit(v.s, sign, t);
      dirty = true;
    }
    last = time;
    if (dirty) {
      if (line.length > MAX) line = line.slice(-MAX);
      glyphs.textContent = line;
      dirty = false;
    }
  };

  status('тиша');
})();
</script>
</body>
</html>
